
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout — CampusBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/canteen.css}">
</head>
<body>
<main class="container py-5" style="max-width: 800px">
    <h1>Review your order</h1>
    <p>Order ID: <strong th:text="${orderId}"></strong></p>

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Item</th>
                    <th>Unit price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td th:text="${item.name}">Item</td>
                    <td th:text="|₹${item.price}|">₹0.00</td>
                    <td th:text="${item.quantity}">1</td>
                    <td th:text="|₹${item.subtotal}|">₹0.00</td>
                </tr>
                </tbody>
            </table>
        </div>

        <hr>

        <h3 class="text-end">
            Total: ₹<span th:text="${total}">0.00</span>
        </h3>

        <form th:action="@{/payment/bill}" method="post">
            <input type="hidden"
                   name="orderId"
                   th:value="${orderId}">

            <input th:if="${_csrf != null}"
                   type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit" class="btn btn-dark w-100 mt-3">
                Proceed to Pay
            </button>
        </form>
    </div>
</main>
</body>
</html>
