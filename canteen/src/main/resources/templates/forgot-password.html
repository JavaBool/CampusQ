
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password — CampusBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/canteen.css}">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <section class="bg-white rounded-4 p-4 p-md-5 w-100"
             style="max-width: 460px; border: 1px solid #e9e8df;">
        <a class="brand" th:href="@{/}" href="/">
            <span class="brand-mark">cb</span>
            <span>campus<span class="brand-accent">bite</span>
                <small>YOUR CAMPUS. YOUR CRAVINGS.</small>
            </span>
        </a>

        <h1 class="mt-5">Forgot password<span class="text-highlight">.</span></h1>
        <p class="text-muted">Enter your registered email to request a reset link.</p>

        <form id="forgotForm">
            <label for="email" class="form-label">Email address</label>
            <input id="email" name="email" type="email"
                   class="form-control rounded-3 mb-3"
                   autocomplete="email" required>

            <button id="submitButton" type="submit"
                    class="btn btn-dark rounded-pill w-100 py-3">
                Send reset link
            </button>
        </form>

        <p id="message" class="mt-3" role="status"></p>

        <a th:href="@{/auth/login}" href="/auth/login"
           class="text-decoration-none">← Back to sign in</a>
    </section>
</main>

<script>
    document.getElementById("forgotForm").addEventListener("submit", async event => {
        event.preventDefault();

        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");
        button.disabled = true;
        message.textContent = "Sending request...";

        try {
            const response = await fetch("/auth/forgot-password", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: document.getElementById("email").value
                })
            });

            const data = await response.json();
            message.textContent = data.message || "Request completed.";
        } catch {
            message.textContent = "Unable to submit the request. Please try again.";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
