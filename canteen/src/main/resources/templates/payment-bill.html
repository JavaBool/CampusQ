
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment — CampusBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/canteen.css}">
</head>
<body>
<main class="container py-5" style="max-width: 520px">
    <div class="card p-4">
        <h1>Payment</h1>

        <p>Order ID: <strong th:text="${orderId}"></strong></p>

        <p class="text-muted mb-1">Transaction ID</p>
        <code th:text="${transactionId}"></code>

        <hr>

        <p class="text-muted mb-1">Total payable</p>
        <h2>₹<span th:text="${total}">0.00</span></h2>

        <p class="text-muted">
            Simulated payment for the CampusBite project.
        </p>

        <div th:if="${paymentStatus == 'PAID'}">
            <p class="text-success">This payment is already complete.</p>
        </div>

        <form th:if="${paymentStatus == 'PENDING'}"
              th:action="@{/payment/pay}"
              method="post">

            <input type="hidden"
                   name="transactionId"
                   th:value="${transactionId}">

            <input th:if="${_csrf != null}"
                   type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit" class="btn btn-dark w-100 mt-3">
                Pay ₹<span th:text="${total}">0.00</span>
            </button>
        </form>
    </div>
</main>
</body>
</html>
