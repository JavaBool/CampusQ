
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password — CampusBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/canteen.css}">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <section class="bg-white rounded-4 p-4 p-md-5 w-100"
             style="max-width: 460px; border: 1px solid #e9e8df;">

        <a class="brand" th:href="@{/}" href="/">
            <span class="brand-mark">cb</span>
            <span>
                campus<span class="brand-accent">bite</span>
                <small>YOUR CAMPUS. YOUR CRAVINGS.</small>
            </span>
        </a>

        <!-- Invalid, expired, or already-used token -->
        <div th:if="${invalidLink}">
            <h1 class="mt-5">
                Invalid reset link<span class="text-highlight">.</span>
            </h1>

            <p class="text-muted">
                This password-reset link is invalid, expired, or has already
                been used. Request a new link to continue.
            </p>

            <a th:href="@{/auth/forgot-password}"
               class="btn btn-dark rounded-pill w-100 py-3">
                Request a new link
            </a>

            <p class="text-center mt-3 mb-0">
                <a th:href="@{/auth/login}">Back to sign in</a>
            </p>
        </div>

        <!-- Display the form only when GET validation succeeds -->
        <div th:unless="${invalidLink}">
            <h1 class="mt-5">
                Reset password<span class="text-highlight">.</span>
            </h1>

            <p class="text-muted">
                Choose a new password for your account.
            </p>

            <form id="resetForm">
                <input type="hidden" id="resetToken" th:value="${token}">

                <label for="password" class="form-label">
                    New password
                </label>
                <input id="password"
                       type="password"
                       class="form-control rounded-3 mb-3"
                       minlength="8"
                       autocomplete="new-password"
                       required>

                <label for="confirmPassword" class="form-label">
                    Confirm password
                </label>
                <input id="confirmPassword"
                       type="password"
                       class="form-control rounded-3 mb-3"
                       minlength="8"
                       autocomplete="new-password"
                       required>

                <button id="submitButton"
                        type="submit"
                        class="btn btn-dark rounded-pill w-100 py-3">
                    Reset password
                </button>
            </form>

            <p id="message" class="mt-3 mb-0" role="status"
               aria-live="polite"></p>
        </div>
    </section>
</main>

<script th:if="${!invalidLink}">
    const resetForm = document.getElementById("resetForm");

    resetForm.addEventListener("submit", async event => {
        event.preventDefault();

        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;
        const token = document.getElementById("resetToken").value;

        message.textContent = "";
        message.className = "mt-3 mb-0";

        if (!token) {
            message.textContent =
                "The reset token is missing. Request a new link.";
            message.classList.add("text-danger");
            return;
        }

        if (password.length < 8) {
            message.textContent =
                "Password must contain at least 8 characters.";
            message.classList.add("text-danger");
            return;
        }

        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            message.classList.add("text-danger");
            return;
        }

        button.disabled = true;
        button.textContent = "Resetting password...";

        try {
            const response = await fetch("/auth/reset-password", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    newPassword: password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                message.textContent =
                    data.message || "The reset link is invalid or expired.";
                message.classList.add("text-danger");
                return;
            }

            message.textContent =
                data.message || "Password reset successfully.";
            message.classList.add("text-success");

            window.location.replace(data.redirectUrl || "/auth/login");
        } catch (error) {
            message.textContent =
                "Unable to reset the password. Please try again.";
            message.classList.add("text-danger");
        } finally {
            button.disabled = false;
            button.textContent = "Reset password";
        }
    });
</script>
</body>
</html>
