
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Confirmed — CampusBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/canteen.css}">
</head>
<body>
<main class="container py-5" style="max-width: 600px">
    <div class="card p-4 text-center">
        <h1 class="text-success">Payment successful!</h1>
        <p>Your CampusBite order has been confirmed.</p>

        <hr>

        <p class="text-muted mb-1">Order ID</p>
        <h3 th:text="${order['orderId']}"></h3>

        <p class="text-muted mt-3 mb-1">Transaction ID</p>
        <code th:text="${order['transactionId']}"></code>

        <p class="text-muted mt-3 mb-1">Payment status</p>
        <strong th:text="${order['paymentStatus']}"></strong>

        <h3 class="mt-4">
            Total paid: ₹<span th:text="${order['total']}"></span>
        </h3>

        <a class="btn btn-dark mt-4" th:href="@{/menu}">
            Back to menu
        </a>
    </div>
</main>
</body>
</html>
