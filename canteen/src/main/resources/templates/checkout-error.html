
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout Error — CampusBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<main class="container py-5" style="max-width: 600px">
    <div class="card p-4">
        <h1>Checkout could not continue</h1>
        <p th:text="${error}">Please try again.</p>
        <a class="btn btn-dark" th:href="@{/cart}">
            Return to cart
        </a>
    </div>
</main>
</body>
</html>
