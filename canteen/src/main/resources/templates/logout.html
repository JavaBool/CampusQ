
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signing out — CampusBite</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/canteen.css}">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <section class="text-center">
        <div style="font-size: 3rem;">👋</div>
        <h1 class="mt-3">Signing you out<span class="text-highlight">.</span></h1>
        <p id="logoutMessage" class="text-muted mt-3">
            Please wait while we securely end your session.
        </p>
        <a id="loginLink" href="/auth/login"
           class="btn btn-dark rounded-pill px-4 mt-3 d-none">
            Go to sign in ↗
        </a>
    </section>
</main>

<script>
    async function logout() {
        const message = document.getElementById("logoutMessage");
        const loginLink = document.getElementById("loginLink");

        try {
            const response = await fetch("/api/v1/auth/logout", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Accept": "application/json"
                }
            });

            if (!response.ok) {
                throw new Error("Logout request failed.");
            }

            const data = await response.json();

            message.textContent = "You have been signed out successfully.";
            window.location.replace(data.redirectUrl || "/auth/login");
        } catch (error) {
            message.textContent =
                "We couldn't complete the logout request. Please try again.";

            loginLink.classList.remove("d-none");
            loginLink.href = "/auth/logout";
            loginLink.textContent = "Try again";
        }
    }

    logout();
</script>
</body>
</html>
