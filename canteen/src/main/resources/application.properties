    spring.application.name=canteen
# JDBC
spring.datasource.url=jdbc:mysql://localhost:3306/campus_bite
spring.datasource.username=${CANTEEN_DB_USERNAME:canteen_user}
spring.datasource.password=${CANTEEN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin@2026}

# Password-reset email configuration
app.mail.from=${MAIL_USERNAME}
app.password-reset.base-url=${APP_BASE_URL:http://localhost:8080}

